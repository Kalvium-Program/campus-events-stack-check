name: Stack check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Throwaway value for this practice stack. Not a real password.
      DB_PASSWORD: ci-only-not-secret
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Docker Compose is available
        run: docker compose version

      - name: Start the stack and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test through Nginx
        run: curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8095/api/events

      # TODO 4 (Task 2): add a step that saves the service logs, and a step that
      # uploads them, both only when an earlier step failed.

      # TODO 5 (Task 2): add a final step that always stops the stack.
